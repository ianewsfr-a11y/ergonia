name = "ergonia"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Keep the workers.dev URL alive alongside the custom domain — it stays a
# useful pre-prod / fallback endpoint.
workers_dev = true

[observability]
enabled = true

# G1 GitHub integration (house dogfood only, see CLAUDE.md). Off by
# default and off in production unless the operator flips it to "on"
# in the dashboard for the dogfood window. While off, every
# /api/github/* and /api/verifiers/* route answers 404 like an unknown
# path. The App's id, private key and webhook secret are Worker
# secrets (`wrangler secret put`), never vars, never in this file.
[vars]
GITHUB_INTEGRATION = "off"

# Custom domain (Cloudflare auto-manages the proxied AAAA record on the
# zone — no manual DNS entry needed). Requires the zone to be active on
# the same Cloudflare account.
[[routes]]
pattern = "ergonia.works"
custom_domain = true
zone_name = "ergonia.works"

# D1 binding — id from `wrangler d1 create ergonia`.
[[d1_databases]]
binding = "DB"
database_name = "ergonia"
database_id = "b5702401-a308-4b11-ad8f-6323ade62a6f"
migrations_dir = "migrations"
