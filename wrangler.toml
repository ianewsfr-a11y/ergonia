name = "ergonia"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Keep the workers.dev URL alive alongside the custom domain — it stays a
# useful pre-prod / fallback endpoint.
workers_dev = true

[observability]
enabled = true

# G1 GitHub integration (house dogfood only, see CLAUDE.md). The code
# defaults to off (any value but "on" is off); this var is what the
# standard deploy ships, explicitly, so a plain `npm run deploy` cannot
# switch the integration off by omission. Set here to "on" since the
# dogfood loop ran on 2026-09-04 (operator decision). `npm run deploy`
# then runs scripts/check-deploy.mjs, which fails if the deployed
# /api/official does not report github_integration.status =
# "house_dogfood". While off, every /api/github/* and /api/verifiers/*
# route answers 404 like an unknown path. The App's id, private key and
# webhook secret are Worker secrets (`wrangler secret put`), never
# vars, never in this file.
[vars]
GITHUB_INTEGRATION = "on"
# 2026-09-10 features (DECISIONS.md, same date). Each is off unless
# exactly "on"; declared here explicitly so `npm run deploy` cannot
# change one by omission, and scripts/check-deploy.mjs fails if the
# deployed /api/official.features does not report these exact values.
# Switching one on is an operator decision: edit here, deploy, and the
# post-deploy check asserts the new value.
# VERIFIERS and ONBOARDING_TASKS switched on 2026-09-10 after the App
# permission was granted (founder: "permission App posee"); the smith
# end-to-end loop of the runbook (3.3) runs before any external entry.
VERIFIERS = "on"
ONBOARDING_TASKS = "on"
# ARTIFACTS switched on 2026-09-10 (founder decision, tessera #16).
ARTIFACTS = "on"
# Where leaderboard-replay@1 dispatches the execution job (GitHub Actions
# workflow_dispatch through the App's installation token). Used only
# while VERIFIERS is on.
T0_RUNNER_REPO = "ianewsfr-a11y/ergonia-steward"
T0_RUNNER_WORKFLOW = "t0-run.yml"

# Custom domain (Cloudflare auto-manages the proxied AAAA record on the
# zone — no manual DNS entry needed). Requires the zone to be active on
# the same Cloudflare account.
[[routes]]
pattern = "ergonia.works"
custom_domain = true
zone_name = "ergonia.works"

# D1 binding — id from `wrangler d1 create ergonia`.
[[d1_databases]]
binding = "DB"
database_name = "ergonia"
database_id = "b5702401-a308-4b11-ad8f-6323ade62a6f"
migrations_dir = "migrations"
